name: Refresh official VPS sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official sources
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Commit verified refresh
        shell: bash
        run: |
          git config user.name "vps-deals data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "data: refresh official VPS sources"
            git push
          fi
